# Общие настройки для обоих разработчиков.
# Меняйте значения здесь, а не в коде, чтобы у вас двоих они совпадали.

model: yolov8n.pt        # веса скачаются сами при первом запуске
conf: 0.4                # порог уверенности (выше = меньше лишних рамок, но больше пропусков)
iou: 0.5                 # порог для склейки пересекающихся рамок
imgsz: 640               # размер картинки для нейросети

output_dir: outputs      # сюда сохраняются видео с рамками и .jsonl
log_file: logs/run.log   # журнал работы
